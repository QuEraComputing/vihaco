[workspace]
resolver = "2"
members = [
    "crates/vihaco",
    "crates/vihaco-abi",
    "crates/vihaco-abi-derive",
    "crates/vihaco-bytecode",
    "crates/vihaco-cpu",
    "crates/vihaco-doctests",
    "crates/vihaco-module",
    "crates/vihaco-parser",
    "crates/vihaco-parser-derive",
    "crates/vihaco-runtime",
    "crates/vihaco-runtime-derive",
    "crates/vihaco-syntax",
]

[workspace.package]
version = "0.2.0"
license = "MIT"
repository = "https://github.com/QuEraComputing/vihaco"
authors = [
    "Kai-Hsin Wu <khwu@quera.com>",
    "Xiuzhe(Roger) Luo <me@rogerluo.dev>",
    "Neelay Fruitwala <nfruitwala@quera.com>",
]

[workspace.dependencies]
vihaco            = { version = "0.2.0", path = "crates/vihaco" }
vihaco-abi        = { version = "0.2.0", path = "crates/vihaco-abi" }
vihaco-abi-derive = { version = "0.2.0", path = "crates/vihaco-abi-derive" }
vihaco-bytecode   = { version = "0.2.0", path = "crates/vihaco-bytecode" }
vihaco-cpu        = { version = "0.2.0", path = "crates/vihaco-cpu" }
vihaco-module     = { version = "0.2.0", path = "crates/vihaco-module" }
vihaco-parser     = { version = "0.2.0", path = "crates/vihaco-parser" }
vihaco-parser-derive = { version = "0.2.0", path = "crates/vihaco-parser-derive" }
vihaco-runtime    = { version = "0.2.0", path = "crates/vihaco-runtime" }
vihaco-runtime-derive = { version = "0.2.0", path = "crates/vihaco-runtime-derive" }
vihaco-syntax     = { version = "0.2.0", path = "crates/vihaco-syntax" }

# Shared third-party dependencies pinned once (see design/crate-split.md §8.1).
byteorder = "1.5.0"
chumsky   = "0.10"
eyre      = "0.6.12"
smallvec  = "1.15.1"
