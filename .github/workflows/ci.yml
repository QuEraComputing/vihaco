name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  feature-checks:
    name: Feature checks (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Check each feature-bearing package independently. Checking the whole
      # workspace in one Cargo invocation can re-enable a dependency's default
      # features through feature unification with another workspace package.
      - name: Check packages without default features
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.features | has("default")) | .name' \
            | while read -r package; do
                echo "Checking $package without default features"
                cargo check -p "$package" --no-default-features
              done

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` excludes doctests; the `doctest` job below covers those.
      # This also compiles the `docs/examples/*.rs` files (via the
      # `vihaco-doctests` crate) and runs the runnable ones.
      - run: cargo test --workspace --all-targets

  doctest:
    name: Doc tests
    runs-on: ubuntu-latest
    # The documentation code lives in `docs/`; the `vihaco-doctests` crate
    # compiles the example files and runs every ```rust block in the guides as
    # a rustdoc doctest. Don't promote warnings to errors here — doctest
    # snippets legitimately contain throwaway bindings.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --doc
