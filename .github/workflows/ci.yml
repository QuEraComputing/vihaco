name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The author guide is also checked in its program-image configuration.
      # Facade opt-in forwards through stdlib to CPU and lower framework crates.
      - run: cargo clippy --workspace --exclude vihaco-doctests --all-targets --features vihaco/typed-declarations -- -D warnings
      - run: cargo clippy --workspace --exclude vihaco-doctests --all-targets --features vihaco/program-image-execution -- -D warnings
      - run: cargo clippy -p vihaco-doctests --all-targets --features program-image-execution -- -D warnings

  feature-checks:
    name: Feature checks (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      # Check each feature-bearing package independently. Checking the whole
      # workspace in one Cargo invocation can re-enable a dependency's default
      # features through feature unification with another workspace package.
      - name: Check packages without default features
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.features | has("default")) | .name' \
            | while read -r package; do
                echo "Checking $package without default features"
                cargo check -p "$package" --no-default-features
              done
      - name: Check experimental runtime contracts independently
        run: |
          cargo check -p vihaco --no-default-features
          cargo check -p vihaco-runtime --no-default-features --features typed-declarations
          cargo check -p vihaco-runtime-derive --no-default-features --features typed-declarations
          cargo check -p vihaco-cpu --no-default-features --features typed-declarations
          cargo check -p vihaco-stdlib --no-default-features
          cargo check -p vihaco-stdlib --no-default-features --features typed-declarations
          cargo check -p vihaco-stdlib --no-default-features --features program-image-execution
          cargo check -p vihaco-module --no-default-features --features program-image-execution
          cargo check -p vihaco-runtime --no-default-features --features program-image-execution
          cargo check -p vihaco --no-default-features --features program-image-execution
          cargo check -p vihaco-cpu --no-default-features --features program-image-execution
          cargo check -p vihaco-cpu --no-default-features --features typed-declarations,program-image-execution

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          # Compile-fail snapshots include standard-library source excerpts.
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` excludes doctests; the `doctest` job below covers those.
      # This also compiles the `docs/examples/*.rs` files (via the
      # `vihaco-doctests` crate) and runs the runnable ones.
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --exclude vihaco-doctests --all-targets --features vihaco/typed-declarations
      - run: cargo test --workspace --exclude vihaco-doctests --all-targets --features vihaco/program-image-execution
      - run: cargo test -p vihaco-doctests --all-targets --features program-image-execution
      - run: cargo test --manifest-path crates/vihaco-cpu/tests/fixtures/features/Cargo.toml -p cpu-off
      - run: cargo test --manifest-path crates/vihaco-cpu/tests/fixtures/features/Cargo.toml -p cpu-on -p cpu-direct
      - run: cargo test --manifest-path crates/vihaco-cpu/tests/fixtures/features/Cargo.toml -p cpu-indirect
      - run: cargo test --manifest-path crates/vihaco-cpu/tests/fixtures/features/Cargo.toml -p cpu-program-image
      - run: cargo test --manifest-path crates/vihaco-cpu/tests/fixtures/features/Cargo.toml -p cpu-program-image-direct

  doctest:
    name: Doc tests
    runs-on: ubuntu-latest
    # The documentation code lives in `docs/`; the `vihaco-doctests` crate
    # compiles the example files and runs every ```rust block in the guides as
    # a rustdoc doctest. Don't promote warnings to errors here — doctest
    # snippets legitimately contain throwaway bindings.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --doc
      - run: cargo test --workspace --exclude vihaco-doctests --doc --features vihaco/typed-declarations
      - run: cargo test --workspace --exclude vihaco-doctests --doc --features vihaco/program-image-execution
      - run: cargo test -p vihaco-doctests --doc --features program-image-execution
