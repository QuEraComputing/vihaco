[package]
name = "vihaco-verifier"
edition = "2024"
description = "Load-time verification engine for vihaco programs: control-flow fixpoint, abstract operand stacks, structured diagnostics."
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
eyre = { workspace = true }
smallvec = { workspace = true }
vihaco-abi = { workspace = true }
vihaco-module = { workspace = true }

[features]
default = []
# Test-only: runs the integration test against a real `#[composite]` machine,
# whose generated `Verify` aggregate exists only in typed-declaration builds.
# It changes nothing for dependents; CI enables it explicitly.
typed-declarations = ["vihaco-runtime/typed-declarations"]

[dev-dependencies]
vihaco-runtime = { workspace = true }
