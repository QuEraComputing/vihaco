[package]
name = "vihaco-stdlib"
edition = "2024"
description = "Standard-library program images, components, and observers for vihaco machines."
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
typed-declarations = [
    "vihaco-runtime/typed-declarations",
    "dep:vihaco-cpu",
    "vihaco-cpu/typed-declarations",
    "vihaco-syntax/typed-declarations", # Integration-test syntax follows the declaration mode.
]
program-image-execution = [
    "dep:chumsky",
    "dep:vihaco-parser",
    "dep:vihaco-parser-derive",
    "typed-declarations",
    "vihaco-runtime/program-image-execution",
    "vihaco-cpu/program-image-execution",
    "vihaco-syntax/program-image-execution",
]

[dependencies]
chumsky = { workspace = true, optional = true }
vihaco-parser = { workspace = true, optional = true }
vihaco-parser-derive = { workspace = true, optional = true }
eyre = { workspace = true }
vihaco-abi = { workspace = true }
vihaco-bytecode = { workspace = true }
vihaco-module = { workspace = true }
vihaco-cpu = { workspace = true, optional = true }
vihaco-runtime = { workspace = true }

[dev-dependencies]
vihaco-parser = { workspace = true }
vihaco-syntax = { workspace = true }

[[example]]
name = "loadable"
required-features = ["program-image-execution"]
