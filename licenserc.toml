[header]
path = "licenserc.header.txt"

# Source globs that get the SPDX header. vihaco is a pure-Rust workspace, so
# this is the crate sources; docs and examples are covered by `excludes`.
[files]
includes = [
  "crates/**/*.rs",
]

excludes = [
  "**/target/**",
  "**/node_modules/**",
  "**/.venv/**",
  "**/dist/**",
  "**/generated/**",
  "**/*.lock",
  "docs/**",
  "examples/**",
  # trybuild compile-fail fixtures: their .stderr snapshots are
  # line-number sensitive, so a header would shift the diagnostics and
  # break the tests. The trybuild *runner* files
  # (tests/compile_errors.rs, tests/composite_machine_compile_fail.rs)
  # are not under these dirs and are still stamped.
  "**/tests/compile_fail/**",
  "**/tests/compile_errors/**",
]

[props]
inception_year = 2026
copyright_owner = "The vihaco Authors"
license_id = "MIT"
